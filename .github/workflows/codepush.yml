name: CodePush Auto-Release OTA Pipeline

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: ⚙️ Generate Version Number & Commit Info
        id: vars
        run: |
          VERSION="1.0.$(date +'%Y%m%d%H%M')"
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: ⚡ Build React Native Android JS Bundle
        run: |
          mkdir -p build_output
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output build_output/index.android.bundle \
            --assets-dest build_output/assets

      - name: 📦 Create ZIP Archive Package
        run: |
          cd build_output
          zip -r ../bundle-update.zip .
          cd ..

      - name: 🏷️ Publish ZIP Package to GitHub Release CDN
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: OTA Release v${{ steps.vars.outputs.version }}
          files: bundle-update.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Publish OTA Release Metadata & Bundle to CodePush Server
        env:
          SERVER_URL: ${{ secrets.CODEPUSH_SERVER_URL }}
          API_KEY: ${{ secrets.CODEPUSH_API_KEY }}
          VERSION: ${{ steps.vars.outputs.version }}
          COMMIT_MSG: ${{ steps.vars.outputs.commit_msg }}
        run: |
          node -e '
            const fs = require("fs");
            const zipBuffer = fs.readFileSync("bundle-update.zip");
            const base64Str = zipBuffer.toString("base64");
            const payload = {
              platform: "android",
              version: process.env.VERSION,
              bundleBase64: base64Str,
              mandatory: true,
              releaseNotes: "Auto-released via Git Push: " + (process.env.COMMIT_MSG || "New hotfix release")
            };
            fs.writeFileSync("payload.json", JSON.stringify(payload));
            console.log("Generated payload.json with base64 bundle (size: " + base64Str.length + " bytes)");
          '
          curl -X POST "${SERVER_URL}/.netlify/functions/publish-release" \
            -H "Content-Type: application/json" \
            -H "x-codepush-api-key: ${API_KEY}" \
            -d @payload.json
